document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"bb8223d5-36b9-489a-a737-f3afba000e5b\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n\n<meta name=\"viewport\" content=\"width=1920\">\n<style>/* ==========================================================================\n   KODYS Design System — Colors, Type, Spacing\n   Sourced from: minimanual-kodys-loga.pdf + kodys.cz observation\n   ========================================================================== */\n\n:root {\n  /* ---- Brand colors (mini-manual) --------------------------------------- */\n  --kodys-blue: #002D62;        /* Pantone 282 — primary */\n  --kodys-grey: #55565A;        /* Cool Grey 11 — secondary */\n  --kodys-yellow: #FFC40C;      /* Pantone 123 — accent */\n\n  /* ---- Extended palette (derived) --------------------------------------- */\n  --kodys-blue-hover: #001F47;  /* -8% lightness */\n  --kodys-blue-press: #001636;\n  --kodys-blue-tint: #E6EAF0;   /* pale tint for panels */\n  --kodys-yellow-hover: #E5AE0A;\n\n  --white: #FFFFFF;\n  --grey-50: #F8F9FA;\n  --grey-100: #F4F5F7;          /* section background */\n  --grey-200: #E3E5E8;          /* hairline border */\n  --grey-300: #C9CCD1;\n  --grey-500: #8A8C91;          /* muted text */\n  --grey-700: #55565A;          /* = kodys-grey */\n  --grey-900: #1B1C1E;\n\n  /* ---- Semantic color roles -------------------------------------------- */\n  --color-bg: var(--white);\n  --color-bg-alt: var(--grey-100);\n  --color-bg-inverse: var(--kodys-blue);\n\n  --color-fg: var(--kodys-blue);        /* headings, strong text */\n  --color-fg-body: var(--kodys-grey);   /* body copy */\n  --color-fg-muted: var(--grey-500);\n  --color-fg-inverse: var(--white);\n\n  --color-border: var(--grey-200);\n  --color-border-strong: var(--grey-300);\n\n  --color-accent: var(--kodys-yellow);\n  --color-focus: var(--kodys-yellow);\n\n  /* Status (derived — not in brand manual) */\n  --color-success: #1E8E3E;\n  --color-warning: #E5AE0A;\n  --color-danger:  #C5221F;\n\n  /* ---- Typography ------------------------------------------------------- */\n  --font-family-base: Arial, \"Helvetica Neue\", Helvetica, sans-serif;\n  --font-family-display: Arial, \"Helvetica Neue\", Helvetica, sans-serif;\n  --font-family-mono: ui-monospace, \"SFMono-Regular\", Menlo, Consolas, monospace;\n\n  /* Weights — Arial ships Regular / Bold / Black */\n  --fw-regular: 400;\n  --fw-bold: 700;\n  --fw-black: 900;\n\n  /* Scale (web) */\n  --fs-xs:    13px;\n  --fs-sm:    14px;\n  --fs-base:  16px;\n  --fs-md:    17px;\n  --fs-lg:    20px;\n  --fs-xl:    22px;\n  --fs-2xl:   28px;\n  --fs-3xl:   32px;\n  --fs-4xl:   40px;\n  --fs-5xl:   48px;\n\n  --lh-tight: 1.15;\n  --lh-snug:  1.3;\n  --lh-normal: 1.5;\n  --lh-loose: 1.7;\n\n  /* ---- Spacing (4px base) ---------------------------------------------- */\n  --sp-0:  0;\n  --sp-1:  4px;\n  --sp-2:  8px;\n  --sp-3:  12px;\n  --sp-4:  16px;\n  --sp-5:  20px;\n  --sp-6:  24px;\n  --sp-8:  32px;\n  --sp-10: 40px;\n  --sp-12: 48px;\n  --sp-16: 64px;\n  --sp-20: 80px;\n  --sp-24: 96px;\n\n  /* ---- Radii ---------------------------------------------------------- */\n  --r-sm: 2px;\n  --r-md: 4px;      /* buttons, inputs */\n  --r-lg: 8px;      /* cards */\n  --r-xl: 12px;\n  --r-pill: 999px;\n\n  /* ---- Shadows (tinted with KODYS Blue) -------------------------------- */\n  --shadow-sm: 0 1px 2px rgba(0, 45, 98, 0.06);\n  --shadow-md: 0 2px 8px rgba(0, 45, 98, 0.08);   /* cards at rest */\n  --shadow-lg: 0 6px 20px rgba(0, 45, 98, 0.12);  /* hover */\n  --shadow-xl: 0 12px 32px rgba(0, 45, 98, 0.18);\n\n  /* ---- Motion --------------------------------------------------------- */\n  --ease-out:  cubic-bezier(0.22, 0.61, 0.36, 1);\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);\n  --dur-fast: 120ms;\n  --dur-base: 200ms;\n  --dur-slow: 400ms;\n\n  /* ---- Layout --------------------------------------------------------- */\n  --container-max: 1200px;\n  --container-narrow: 840px;\n  --header-height: 72px;\n}\n\n/* ==========================================================================\n   Base typography — semantic element styles\n   ========================================================================== */\n\nbody {\n  font-family: var(--font-family-base);\n  font-size: var(--fs-base);\n  line-height: var(--lh-normal);\n  color: var(--color-fg-body);\n  background: var(--color-bg);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\nh1, .h1 {\n  font-family: var(--font-family-display);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-5xl);\n  line-height: var(--lh-tight);\n  color: var(--color-fg);\n  margin: 0 0 var(--sp-6);\n  text-wrap: balance;\n}\n\nh2, .h2 {\n  font-family: var(--font-family-display);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-3xl);\n  line-height: var(--lh-snug);\n  color: var(--color-fg);\n  margin: 0 0 var(--sp-5);\n  text-wrap: balance;\n}\n\nh3, .h3 {\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-xl);\n  line-height: var(--lh-snug);\n  color: var(--color-fg);\n  margin: 0 0 var(--sp-3);\n}\n\nh4, .h4 {\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-lg);\n  line-height: var(--lh-snug);\n  color: var(--color-fg);\n  margin: 0 0 var(--sp-3);\n}\n\np {\n  margin: 0 0 var(--sp-4);\n  line-height: var(--lh-normal);\n  text-wrap: pretty;\n}\n\nsmall, .caption {\n  font-size: var(--fs-sm);\n  color: var(--color-fg-muted);\n  line-height: var(--lh-snug);\n}\n\na {\n  color: var(--kodys-blue);\n  text-decoration: none;\n  transition: color var(--dur-fast) var(--ease-out);\n}\na:hover { text-decoration: underline; }\na:focus-visible {\n  outline: 2px solid var(--color-focus);\n  outline-offset: 2px;\n  border-radius: var(--r-sm);\n}\n\ncode, kbd, samp {\n  font-family: var(--font-family-mono);\n  font-size: 0.92em;\n  background: var(--grey-100);\n  padding: 0.1em 0.35em;\n  border-radius: var(--r-sm);\n}\n\n/* Utility typography classes */\n.text-blue   { color: var(--kodys-blue); }\n.text-grey   { color: var(--kodys-grey); }\n.text-yellow { color: var(--kodys-yellow); }\n.text-muted  { color: var(--color-fg-muted); }\n.text-white  { color: var(--white); }\n\n.bg-blue   { background: var(--kodys-blue); color: var(--white); }\n.bg-grey   { background: var(--grey-100); }\n.bg-yellow { background: var(--kodys-yellow); color: var(--kodys-blue); }\n<\u002Fstyle>\n<script src=\"ee32b6e5-6474-4d55-99b6-61c2aa0e3618\"><\u002Fscript>\n<style>\n* { box-sizing: border-box; }\nbody { margin: 0; background: var(--grey-100); font-family: var(--font-family-base); }\ninput, select, button, textarea { font-family: var(--font-family-base); font-size: 14px; color: var(--kodys-blue); }\ninput:focus-visible, select:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--kodys-yellow); outline-offset: 1px; }\na { color: var(--kodys-blue); }\na:hover { color: var(--kodys-blue-hover); }\n.tt-row:hover { background: var(--grey-50); }\n.tt-nav:hover { background: var(--kodys-blue-tint); }\n.tt-link { text-decoration: none; }\n.tt-link:hover { text-decoration: underline; }\n@keyframes ttspin { to { transform: rotate(360deg); } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<sc-if value=\"{{ isLogin }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; background: var(--white)\">\n  <div style=\"background: var(--kodys-blue); color: var(--white); padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between\">\n    <div style=\"font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.7)\">Movianto Česká republika<\u002Fdiv>\n    <div>\n      <div style=\"font-size: 44px; font-weight: 700; line-height: 1.1; margin-bottom: 16px\">Přehled zásilek<\u002Fdiv>\n      <div style=\"font-size: 18px; line-height: 1.55; color: rgba(255,255,255,0.82); max-width: 420px\">Evidence a dispečerský přehled zásilek a balíků v depech Podolí, Jeneč a Senec.<\u002Fdiv>\n      <div style=\"height: 3px; width: 72px; background: var(--kodys-yellow); margin-top: 28px\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size: 13px; color: rgba(255,255,255,0.6)\">Dodavatel řešení: KODYS, spol. s r.o. · Track &amp; Trace v 1.0<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display: flex; align-items: center; justify-content: center; padding: 48px\">\n    <form style=\"width: 340px\" sc-camel-on-submit=\"{{ onLoginSubmit }}\">\n      <div style=\"font-size: 22px; font-weight: 700; color: var(--kodys-blue); margin-bottom: 4px\">Přihlášení<\u002Fdiv>\n      <div style=\"font-size: 14px; color: var(--kodys-grey); margin-bottom: 28px\">Zadejte přihlašovací údaje dispečinku.<\u002Fdiv>\n      <sc-if value=\"{{ loginError }}\">\n        <div style=\"display: flex; gap: 10px; padding: 12px 14px; border: 1px solid var(--color-danger); border-left: 4px solid var(--color-danger); background: #FCF0F0; border-radius: 4px; margin-bottom: 20px\">\n          <div style=\"font-weight: 700; color: var(--color-danger); font-size: 14px\">!<\u002Fdiv>\n          <div style=\"font-size: 14px; color: var(--grey-900); line-height: 1.45\">{{ loginError }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <label style=\"display: block; font-size: 13px; font-weight: 700; color: var(--kodys-blue); margin-bottom: 6px\">Login<\u002Flabel>\n      <input ref=\"{{ loginRef }}\" value=\"{{ login }}\" sc-camel-on-change=\"{{ onLoginChange }}\" style=\"width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--grey-300); border-radius: 4px; margin-bottom: 18px; background: var(--white)\">\n      <label style=\"display: block; font-size: 13px; font-weight: 700; color: var(--kodys-blue); margin-bottom: 6px\">Heslo<\u002Flabel>\n      <input type=\"password\" value=\"{{ pass }}\" sc-camel-on-change=\"{{ onPassChange }}\" style=\"width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--grey-300); border-radius: 4px; margin-bottom: 24px; background: var(--white)\">\n      <button type=\"submit\" disabled=\"{{ loggingIn }}\" style=\"width: 100%; height: 44px; border: 0; border-radius: 4px; background: var(--kodys-blue); color: var(--white); font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px\">\n        <sc-if value=\"{{ loggingIn }}\">\n          <span style=\"width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.35); border-top-color: var(--white); border-radius: 50%; display: inline-block; animation: ttspin 700ms linear infinite\"><\u002Fspan>\n        <\u002Fsc-if>\n        {{ loginButtonLabel }}\n      <\u002Fbutton>\n      <div style=\"margin-top: 20px; font-size: 13px; color: var(--grey-500); line-height: 1.5\">Demo: přihlaste se libovolným loginem. Prázdný login nebo login <code>audit<\u002Fcode> ukáže chybový stav.<\u002Fdiv>\n    <\u002Fform>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isApp }}\">\n<div style=\"height: 100vh; display: flex; flex-direction: column; background: var(--grey-100)\">\n\n  <header style=\"height: 56px; flex: none; background: var(--white); border-bottom: 1px solid var(--grey-200); display: flex; align-items: center; justify-content: space-between; padding: 0 20px\">\n    <div style=\"display: flex; align-items: center; gap: 14px\">\n      <div style=\"font-size: 17px; font-weight: 700; color: var(--kodys-blue)\">Movianto<\u002Fdiv>\n      <div style=\"width: 1px; height: 22px; background: var(--grey-200)\"><\u002Fdiv>\n      <div style=\"font-size: 15px; color: var(--kodys-grey)\">Přehled zásilek<\u002Fdiv>\n      <div style=\"font-size: 12px; color: var(--grey-500); border: 1px solid var(--grey-200); border-radius: 999px; padding: 2px 10px\">Track &amp; Trace<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: flex; align-items: center; gap: 16px\">\n      <div style=\"display: flex; align-items: center; gap: 8px\">\n        <div style=\"width: 28px; height: 28px; border-radius: 50%; background: var(--kodys-blue-tint); color: var(--kodys-blue); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center\">RN<\u002Fdiv>\n        <div style=\"font-size: 14px; color: var(--grey-900)\">{{ userName }}<\u002Fdiv>\n        <div style=\"font-size: 12px; color: var(--grey-500)\">Dispečer<\u002Fdiv>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ onLogout }}\" style=\"height: 32px; padding: 0 12px; background: var(--white); border: 1px solid var(--grey-300); border-radius: 4px; color: var(--kodys-blue); font-size: 13px; cursor: pointer\">Odhlásit<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"flex: 1; display: flex; min-height: 0\">\n    <nav style=\"width: 212px; flex: none; background: var(--white); border-right: 1px solid var(--grey-200); display: flex; flex-direction: column; justify-content: space-between; padding: 12px 0\">\n      <div style=\"display: flex; flex-direction: column; gap: 2px\">\n        <sc-for list=\"{{ navItems }}\" as=\"n\" hint-placeholder-count=\"4\">\n          <div>\n            <div class=\"tt-nav\" sc-camel-on-click=\"{{ n.onClick }}\" style=\"{{ n.style }}\">\n              <span style=\"{{ n.markStyle }}\"><\u002Fspan>\n              {{ n.label }}\n            <\u002Fdiv>\n            <sc-if value=\"{{ n.showSub }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 1px; padding: 2px 0 6px 0\">\n                <sc-for list=\"{{ n.sub }}\" as=\"s\" hint-placeholder-count=\"4\">\n                  <div class=\"tt-nav\" sc-camel-on-click=\"{{ s.onClick }}\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"padding: 14px 16px; border-top: 1px solid var(--grey-200); font-size: 11px; line-height: 1.5; color: var(--grey-500)\">\n        Dodavatel<br>\n        <span style=\"color: var(--kodys-grey); font-weight: 700\">KODYS, spol. s r.o.<\u002Fspan><br>\n        v 1.0.06954.19821\n      <\u002Fdiv>\n    <\u002Fnav>\n\n    <main style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: auto\">\n\n      <sc-if value=\"{{ isList }}\">\n      <div style=\"padding: 0 20px 24px; display: flex; flex-direction: column; gap: 12px\">\n        <div style=\"position: sticky; top: 0; z-index: 20; background: var(--grey-100); margin: 0 -20px; padding: 18px 20px 12px; display: flex; align-items: flex-end; justify-content: space-between\">\n          <div>\n            <div style=\"display: flex; align-items: center; gap: 14px\">\n              <div style=\"font-size: 22px; font-weight: 700; color: var(--kodys-blue)\">Zásilky<\u002Fdiv>\n              <div style=\"position: relative\">\n                <button sc-camel-on-click=\"{{ onDepoToggle }}\" style=\"{{ depoBtnStyle }}\">\n                  <span style=\"display: flex; align-items: center; padding: 0 10px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--grey-500); background: var(--grey-50); border-right: 1px solid var(--grey-200)\">Depo<\u002Fspan>\n                  <span style=\"display: flex; align-items: center; gap: 8px; padding: 0 10px; font-size: 14px; font-weight: 700; color: var(--kodys-blue)\">\n                    <span style=\"width: 8px; height: 8px; border-radius: 2px; background: var(--kodys-yellow)\"><\u002Fspan>\n                    {{ activeDepoLabel }}\n                  <\u002Fspan>\n                  <sc-if value=\"{{ hasDepoMenu }}\">\n                    <span style=\"display: flex; align-items: center; justify-content: center; width: 26px; border-left: 1px solid var(--grey-200); color: var(--kodys-grey)\">\n                      <svg sc-camel-view-box=\"0 0 24 24\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n                    <\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fbutton>\n                <sc-if value=\"{{ depoMenuOpen }}\">\n                  <div style=\"position: absolute; left: 0; top: 38px; z-index: 40; min-width: 210px; background: var(--white); border: 1px solid var(--grey-200); border-radius: 6px; box-shadow: 0 12px 32px rgba(0,45,98,0.18); padding: 6px\">\n                    <div style=\"font-size: 11px; color: var(--grey-500); padding: 4px 8px 6px\">Depa přihlášeného uživatele<\u002Fdiv>\n                    <sc-for list=\"{{ depoOpts }}\" as=\"d\" hint-placeholder-count=\"2\">\n                      <div class=\"tt-nav\" sc-camel-on-click=\"{{ d.onClick }}\" style=\"{{ d.style }}\">{{ d.label }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size: 13px; color: var(--kodys-grey); margin-top: 6px\">{{ listSummary }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 10px\">\n            <button sc-camel-on-click=\"{{ openNew }}\" style=\"height: 38px; padding: 0 16px; background: var(--kodys-blue); border: 0; border-radius: 4px; color: var(--white); font-size: 14px; font-weight: 700; cursor: pointer\">Nová zásilka<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap\">\n          <sc-for list=\"{{ tiles }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"{{ t.style }}\">\n              <span style=\"{{ t.countStyle }}\">{{ t.count }}<\u002Fspan>\n              <span style=\"{{ t.labelStyle }}\">{{ t.label }}<\u002Fspan>\n rs;\n      const out = { rideChecks: c, rideZoneErrors: e };\n      if (o.zony) out.rides = x.rides.map(z => z.id === j.id ? Object.assign({}, z, { zony: o.zony }) : z);\n      return out;\n    });\n    return {\n      cislo: j.cislo, badges: this.rideBadges(j, 'detail'),\n      locked: locked, unlocked: !locked,\n      lockNote: !locked ? '' : (closed\n        ? 'Jízda je ve stavu Ukončená. Jízda je uzavřená, měnit už nelze nic.'\n        : 'Jízda je ve stavu Zahájená. Parametry jízdy — vozidlo, řidič i zóny — už měnit nelze. Stavy balíků se mění dál, tím jízda žije.'),\n      facts: [\n        { label: 'Datum jízdy', value: j.datum },\n        { label: 'Typ', value: j.typ + (j.typ === 'Transfer' ? ' → ' + j.cilDepo : '') },\n        { label: 'Vozidlo', value: j.spz + (car.typ ? ' · ' + car.typ : '') },\n        { label: 'Dopravce', value: this.carrierOfRide(j) },\n        { label: 'Řidič', value: j.ridic },\n        { label: 'Depo původu', value: j.depo },\n        { label: 'Zahájení', value: j.zahajeno },\n        { label: 'Ukončení', value: j.ukonceno }\n      ],\n      hasZoneNote: !locked,\n      zoneNote: 'Odkud se má nakládat. Zásilky ležící v přiřazených zónách se objeví vpravo.',\n      zones: j.zony.map(z => {\n        const zd = this.zoneDef(z);\n        return {\n          zona: z, popis: zd ? zd.popis : '',\n          removeTitle: 'Odebrat zónu ' + z + ' z jízdy. Balíky, které z ní jsou už naložené, v tabulce zásilek zůstanou.',\n          onRemove: () => {\n            patch({ zony: j.zony.filter(y => y !== z) });\n          }\n        };\n      }),\n      canEditZones: !locked,\n      offerLabel: 'Nabídka zón depa ' + j.depo,\n      offerEmpty: offer.length === 0,\n      offerEmptyNote: 'Všechny běžné zóny depa jsou k jízdě přiřazené.',\n      offer: offer.map(o => ({\n        zona: o.zona, popis: o.popis,\n        ships: ships(o.ships),\n        shipsTitle: 'V zóně teď leží ' + ships(o.ships) + '. Počet zásilek je jediná nápověda, podle které se zóna vybírá.',\n        checked: checks.indexOf(o.zona) >= 0,\n        error: errs[o.zona] || '', hasError: !!errs[o.zona],\n        onToggle: () => {\n          const on = checks.indexOf(o.zona) >= 0;\n          const e2 = Object.assign({}, errs);\n          delete e2[o.zona];\n          patch({ checks: on ? checks.filter(y => y !== o.zona) : checks.concat([o.zona]), errors: e2 });\n        }\n      })),\n      addLabel: checks.length ? 'Přidat (' + checks.length + ')' : 'Přidat',\n      addStyle: 'align-self: flex-start; height: 34px; padding: 0 16px; border: 0; border-radius: 4px; font-size: 13px; font-weight: 700; font-family: inherit; color: var(--white); background: ' +\n        (checks.length ? 'var(--kodys-blue)' : 'var(--grey-300)') + '; cursor: ' + (checks.length ? 'pointer' : 'not-allowed'),\n      // dávka se přidá po částech: co přidat lze, se přidá; kolidující zůstane zaškrtnuté s důvodem\n      onAdd: () => {\n        if (!checks.length) return;\n        const ok = [], bad = {};\n        checks.forEach(z => { const e3 = this.zoneConflict(j, z); if (e3) bad[z] = e3; else ok.push(z); });\n        patch({ zony: j.zony.concat(ok), checks: Object.keys(bad), errors: bad });\n      },\n      zoneHint: 'V nabídce jsou jen aktivní zóny depa jízdy s typem Běžná. Zóny typu Poškozeno a Osobní odběr se nenabízejí — balíky na nich se nikam nevozí.',\n      hasShipCounter: locked ? loadedAll > 0 : (loadedAll + plannedAll) > 0,\n      shipCounter: locked ? pkgs(loadedAll) : 'Naloženo (' + loadedAll + ' / ' + plannedAll + ')',\n      shipCounterTitle: !locked\n        ? 'Postup nakládky celé jízdy v balících: naložené ku balíkům ležícím v přiřazených zónách.'\n        : (closed ? 'Balíky, které jízda odvezla.' : 'Balíky, které jsou na jízdě naložené.'),\n      shipNote: !locked\n        ? 'Živý pohled: zásilky z přiřazených zón a zásilky, jejichž balík už je na jízdě naložený. Obsah zóny se během dne mění a tabulka to odráží.'\n        : (closed ? 'Co jízda odvezla.' : 'Co je v autě. Nakládka je hotová, takže se tu zobrazují jen naložené balíky.'),\n      isEmpty: rows.length === 0,\n      emptyNote: !locked\n        ? 'Zatím nic naloženého. Přiřaďte zónu vlevo.'\n        : (closed ? 'Na jízdě nebyl naložený žádný balík.' : 'Na jízdě není naložený žádný balík.'),\n      manual: !j.rizena,\n      manualNote: 'Neřízená jízda: cizí dopravce nemá naše terminály, takže stavy balíků přepíná dispečer na webu — u celé zásilky i u jednotlivého balíku. Je to náhradní cesta, ne standardní ovládání.',\n      rows: rows.map(r => {\n        const key = j.id + '|' + r.s.id;\n        const open = !!(st.rideOpen || {})[key];\n        const target = this.nextManualState(r.items.map(i => i.p));\n        return {\n          cislo: r.s.id, partner: r.s.partner, odberatel: r.s.odberatel,\n          hasBadge: r.unplanned,\n          badge: this.sb('Neplánováno', 'attention', { title: 'Na jízdě je naložený balík ze zóny, která k ní přiřazená není. Fyzicky je v autě, proto je zásilka vidět. Rozdíl počitadla není chyba.' }) || {},\n          counters: r.counters.map(c => {\n            const excess = c.loaded > c.planned;\n            const pct = c.planned ? Math.round(Math.min(1, c.loaded / c.planned) * 100) : 0;\n            return {\n              label: c.label,\n              // zlomek a pruh mají smysl jen dokud je co plánovat\n              hasBar: c.fraction,\n              title: !c.fraction ? 'Naloženo na jízdě.' : (excess\n                ? 'Naloženo víc, než v přiřazených zónách leží — neplánovaný balík. Není to chyba výpočtu.'\n                : c.loaded + ' z ' + c.planned + ' naloženo'),\n              fillStyle: 'height: 100%; width: ' + (excess ? 100 : pct) + '%; background: ' + (excess ? 'var(--kodys-yellow)' : 'var(--kodys-blue)')\n            };\n          }),\n          open: open, caret: open ? '▾' : '▸',\n          toggleTitle: open ? 'Sbalit balíky zásilky' : 'Rozbalit balíky zásilky',\n          onToggle: () => this.setState(x => {\n            const m = Object.assign({}, x.rideOpen);\n            if (m[key]) delete m[key]; else m[key] = true;\n            return { rideOpen: m };\n          }),\n          onOpen: e => { if (e && e.preventDefault) e.preventDefault(); this.openDetail(r.s.id); },\n          canSwitch: !j.rizena && !!target,\n          switchLabel: target === 'Naloženo' ? 'Naložit celou zásilku' : 'Doručit celou zásilku',\n          onSwitch: () => this.manualSwitch(j, r.s, r.items.map(i => i.p)),\n          groups: r.groups.map(g => ({\n            label: g.label,\n            // typ balení nese popisek skupiny, takže z dlaždice mizí\n            packages: g.items.map(i => {\n              const p = i.p;\n              const zona = this.pkgZona(p);\n              return {\n                cislo: p.cislo, zona: zona, hasZona: !!zona,\n                // dlaždice je potlačená a stav nese badge — orámování by bylo druhým nositelem téže informace\n                style: 'display: flex; align-items: center; gap: 9px; background: var(--white); border: 1px solid var(--grey-200); border-radius: 4px; padding: 6px 9px; font-size: 12px; color: var(--kodys-grey)',\n                // výjimka z pravidla „badge jen pro odchylku“: sekce slouží k porovnávání stavů mezi sebou\n                stav: this.sbOf('stav', p.stav) || {},\n                canSwitch: !j.rizena && (i.loaded ? p.stav === 'Naloženo' : p.stav === 'K dispozici'),\n                switchLabel: i.loaded ? 'Doručit' : 'Naložit',\n                onSwitch: () => this.manualSwitch(j, r.s, [p])\n              };\n            })\n          }))\n        };\n      }),\n      planShipments: this.planShipments(j),\n      onPrint: () => this.setState({ screen: 'ridePrint', printNote: '' }),\n      onBack: e => { if (e && e.preventDefault) e.preventDefault(); this.setState({ screen: 'rides' }); }\n    };\n  }\n  nextManualState(pkgs) {\n    const has = x => pkgs.some(p => p.stav === x);\n    if (has('K dispozici')) return 'Naloženo';\n    if (has('Naloženo')) return 'Doručeno';\n    return '';\n  }\n  // u neřízené jízdy zapisuje přepnutí stavu i obsah jízdy — žádný sken neexistuje\n  manualSwitch(j, s, pkgs) {\n    const target = this.nextManualState(pkgs);\n    if (!target) return;\n    const from = target === 'Naloženo' ? 'K dispozici' : 'Naloženo';\n    const hit = pkgs.filter(p => p.stav === from).map(p => p.cislo);\n    if (!hit.length) return;\n    this.setState({ confirm: {\n      title: 'Přepnout ' + hit.length + ' balíků na ' + target + '?',\n      lines: ['Jízda ' + j.cislo + ' je neřízená — stav zapisuje dispečer na webu, ne terminál.',\n        target === 'Naloženo' ? 'Balíky se zároveň zapíšou do obsahu jízdy.' : 'Po ' + (j.typ === 'Transfer' ? 'vyložení' : 'doručení') + ' posledního balíku se jízda automaticky ukončí.'],\n      confirmLabel: 'Přepnout na ' + target,\n      onConfirm: () => {\n        this.setState(x => {\n          const shipments = x.shipments.map(z => {\n            if (z.id !== s.id) return z;\n            const packages = z.packages.map(p => {\n              if (hit.indexOf(p.cislo) < 0) return p;\n              const patch = { stav: target };\n              if (target === 'Naloženo') { patch.jizda = j.cislo; patch.jizdaHist = (p.jizdaHist || []).concat([j.cislo]); }\n              if (target === 'Doručeno') { patch.jizda = ''; }\n              return Object.assign({}, p, patch);\n            });\n            const hist = (z.historie || []).concat([\n              { den: TODAY, cas: '15:40', pole: target === 'Naloženo' ? 'jizda' : 'stav', hodnota: target === 'Naloženo' ? j.cislo : target,\n                pkgs: hit, user: 'Radovan Novotný', zdroj: 'web', note: 'neřízená jízda — ruční přepnutí dispečerem' },\n              { den: TODAY, cas: '15:40', pole: 'stav', hodnota: target, pkgs: hit, user: 'Radovan Novotný', zdroj: 'web', note: 'neřízená jízda' }\n            ]);\n            return Object.assign({}, z, { packages: packages, historie: hist });\n          });
